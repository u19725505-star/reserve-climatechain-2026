name: RESERVE smart-contract tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  solidity-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run contract tests
        run: forge test -vvv
